server.port=8080
spring.application.name=gateway-service

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Global CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[4]=PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[5]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# Route 0: account-service-rest
spring.cloud.gateway.routes[0].id=account-service-rest
spring.cloud.gateway.routes[0].uri=lb://account-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/accounts/**

# Route 1: account-service-mcp
spring.cloud.gateway.routes[1].id=account-service-mcp
spring.cloud.gateway.routes[1].uri=lb://account-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/mcp/accounts/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/mcp/accounts(?<segment>/?.*), /mcp$\\{segment\\}

# Route 2: account-service-graphql
spring.cloud.gateway.routes[2].id=account-service-graphql
spring.cloud.gateway.routes[2].uri=lb://account-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/graphql/accounts/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/graphql/accounts(?<segment>/?.*), /graphql$\\{segment\\}

# Route 3: transaction-service-rest
spring.cloud.gateway.routes[3].id=transaction-service-rest
spring.cloud.gateway.routes[3].uri=lb://transaction-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/transactions/**

# Route 4: transaction-service-mcp
spring.cloud.gateway.routes[4].id=transaction-service-mcp
spring.cloud.gateway.routes[4].uri=lb://transaction-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/mcp/transactions/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/mcp/transactions(?<segment>/?.*), /mcp$\\{segment\\}

# Route 5: transaction-service-graphql
spring.cloud.gateway.routes[5].id=transaction-service-graphql
spring.cloud.gateway.routes[5].uri=lb://transaction-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/graphql/transactions/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/graphql/transactions(?<segment>/?.*), /graphql$\\{segment\\}

# Route 6: audit-service-rest
spring.cloud.gateway.routes[6].id=audit-service-rest
spring.cloud.gateway.routes[6].uri=lb://notification-audit-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/audit/**

# Route 7: chatbot-service-rest
spring.cloud.gateway.routes[7].id=chatbot-service-rest
spring.cloud.gateway.routes[7].uri=lb://agentic-chatbot-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/chat/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,gateway

