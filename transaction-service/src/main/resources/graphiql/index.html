<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ADRIA Bank — GraphiQL Transactions</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #F8FAFC;
            color: #0F172A;
            height: 100vh;
            overflow: hidden;
        }

        #graphiql {
            height: 100vh;
            width: 100vw;
        }

        .fallback-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: #F8FAFC;
        }

        .fallback-header {
            height: 60px;
            background: #FFFFFF;
            border-bottom: 1px solid #E2E8F0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 14px;
            color: #0D9488;
        }

        .actions-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-run {
            background: #0D9488;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .btn-run:hover { background: #0F766E; }

        .btn-preset {
            background: #F1F5F9;
            color: #475569;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            padding: 7px 14px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-preset:hover { background: #E2E8F0; }

        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #E2E8F0;
            background: #FFFFFF;
        }
        .panel:last-child { border-right: none; }

        .panel-title {
            padding: 10px 18px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748B;
            background: #F8FAFC;
            border-bottom: 1px solid #E2E8F0;
        }

        textarea {
            flex: 1;
            width: 100%;
            border: none;
            padding: 18px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #0F172A;
            background: #FFFFFF;
            outline: none;
            resize: none;
        }

        pre {
            flex: 1;
            margin: 0;
            padding: 18px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #0F172A;
            background: #F8FAFC;
            overflow: auto;
        }
    </style>

    <!-- GraphiQL Official CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/graphiql@3/graphiql.min.js" type="application/javascript"></script>
    <link rel="stylesheet" href="https://unpkg.com/graphiql@3/graphiql.min.css" />
</head>
<body>
<div id="graphiql"></div>

<script>
    const defaultQuery = `query GetAllTransactions {
  allTransactions {
    id
    accountId
    amount
    currency
    merchantCategory
    country
    createdAt
  }
}`;

    const params = new URLSearchParams(window.location.search);
    const path = params.get("path") || "/graphql";
    const url = `${location.protocol}//${location.host}${path}`;

    function renderFallbackUI() {
        document.getElementById('graphiql').innerHTML = `
            <div class="fallback-container">
                <div class="fallback-header">
                    <div class="logo-area">
                        <span>🏛️ ADRIA BANK — GraphQL Transactions Console</span>
                    </div>
                    <div class="actions-area">
                        <button class="btn-preset" onclick="setPreset(1)">Transactions (allTransactions)</button>
                        <button class="btn-preset" onclick="setPreset(2)">Virement (Mutation transferFunds)</button>
                        <button class="btn-run" onclick="executeGraphQL()">▶ Exécuter la Requête</button>
                    </div>
                </div>
                <div class="workspace">
                    <div class="panel">
                        <div class="panel-title">Requête GraphQL (POST ${path})</div>
                        <textarea id="gql-query" spellcheck="false">${defaultQuery}</textarea>
                    </div>
                    <div class="panel">
                        <div class="panel-title">Résultat JSON en Temps Réel</div>
                        <pre id="gql-result">// Cliquez sur "Exécuter la Requête" pour voir le résultat...</pre>
                    </div>
                </div>
            </div>
        `;
        window.executeGraphQL();
    }

    window.setPreset = function(type) {
        const textarea = document.getElementById('gql-query');
        if (type === 1) {
            textarea.value = `query GetAllTransactions {
  allTransactions {
    id
    accountId
    amount
    currency
    merchantCategory
    country
    createdAt
  }
}`;
        } else if (type === 2) {
            textarea.value = `mutation TransferFunds {
  transferFunds(input: {
    sourceAccountId: "UUID_SOURCE"
    targetAccountId: "UUID_DEST"
    amount: 250.0
    currency: "MAD"
    description: "Transfert via GraphQL"
  }) {
    transferId
    status
    message
  }
}`;
        }
        window.executeGraphQL();
    };

    window.executeGraphQL = async function() {
        const queryText = document.getElementById('gql-query').value;
        const resultElem = document.getElementById('gql-result');
        resultElem.textContent = "Exécution en cours...";

        try {
            const resp = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: queryText })
            });
            const data = await resp.json();
            resultElem.textContent = JSON.stringify(data, null, 2);
        } catch (e) {
            resultElem.textContent = "Erreur: " + e.message;
        }
    };

    window.addEventListener('DOMContentLoaded', () => {
        try {
            if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined' && typeof GraphiQL !== 'undefined') {
                const wsPath = params.get("wsPath") || "/graphql";
                const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                const subscriptionUrl = `${wsProtocol}//${location.host}${wsPath}`;
                const gqlFetcher = GraphiQL.createFetcher({'url': url, 'subscriptionUrl': subscriptionUrl});
                ReactDOM.render(
                    React.createElement(GraphiQL, {
                        fetcher: gqlFetcher,
                        query: defaultQuery,
                        defaultVariableEditorOpen: true,
                        headerEditorEnabled: true,
                        shouldPersistHeaders: true
                    }),
                    document.getElementById('graphiql')
                );
            } else {
                renderFallbackUI();
            }
        } catch (err) {
            console.warn("GraphiQL CDN error, loading fallback console:", err);
            renderFallbackUI();
        }
    });

    setTimeout(() => {
        const el = document.getElementById('graphiql');
        if (!el || el.children.length === 0 || el.innerText === 'Loading...') {
            renderFallbackUI();
        }
    }, 1200);
</script>
</body>
</html>
